# Build iOS do Controle de Bola (Ionic + Capacitor) em runner macOS.
# Ver docs/IOS_GITHUB_ACTIONS.md

name: iOS Capacitor Build

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Tipo de build'
        required: true
        default: simulator
        type: choice
        options:
          - simulator
          - release-ipa
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-capacitor-build.yml'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ios-capacitor-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  BUNDLE_ID: com.minhapelada.app

jobs:
  build-ios:
    name: Build iOS Capacitor
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Usar github.event.inputs (nao inputs.*) — em push o contexto inputs invalida o YAML (0 jobs).
      BUILD_TARGET: ${{ github.event.inputs.build_target || 'simulator' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
          package-manager-cache: false

      - name: Write environment.local.ts from secret
        env:
          ENVIRONMENT_LOCAL_TS: ${{ secrets.ENVIRONMENT_LOCAL_TS }}
        run: |
          set -euo pipefail
          OUT="src/environments/environment.local.ts"
          if [ -z "${ENVIRONMENT_LOCAL_TS:-}" ]; then
            echo "::error::Secret ENVIRONMENT_LOCAL_TS ausente. Cole o conteudo de src/environments/environment.local.ts em Settings → Secrets → Actions."
            exit 1
          fi
          printf '%s\n' "$ENVIRONMENT_LOCAL_TS" > "$OUT"
          if ! grep -q 'export const parseLocal' "$OUT"; then
            echo "::error::ENVIRONMENT_LOCAL_TS nao parece um environment.local.ts valido (faltou export const parseLocal)."
            exit 1
          fi
          echo "environment.local.ts escrito a partir do secret."

      - name: Install dependencies
        run: npm ci

      - name: Build web (production → www/)
        run: npm run build -- --configuration production

      - name: Add Capacitor iOS platform (SPM)
        run: |
          set -euo pipefail
          # Capacitor 8 cria iOS com Swift Package Manager por padrao (sem Podfile).
          if [ ! -d ios ]; then
            npx cap add ios --packagemanager SPM
          fi
          npx cap sync ios
          echo "Estrutura ios/:"
          find ios -maxdepth 3 \( -name '*.xcodeproj' -o -name '*.xcworkspace' -o -name Podfile -o -name Package.swift -o -name CapApp-SPM \) -print

      - name: Resolve Xcode project (SPM vs CocoaPods)
        run: |
          set -euo pipefail
          if [ -f ios/App/Podfile ]; then
            echo "XCODE_PROJECT_FLAG=-workspace" >> "$GITHUB_ENV"
            echo "XCODE_PROJECT_PATH=ios/App/App.xcworkspace" >> "$GITHUB_ENV"
            echo "Usando CocoaPods workspace."
          elif [ -d ios/App/App.xcodeproj ]; then
            echo "XCODE_PROJECT_FLAG=-project" >> "$GITHUB_ENV"
            echo "XCODE_PROJECT_PATH=ios/App/App.xcodeproj" >> "$GITHUB_ENV"
            echo "Usando Xcode project (SPM)."
          else
            echo "::error::Nem Podfile nem App.xcodeproj encontrados em ios/App."
            ls -la ios ios/App || true
            exit 1
          fi

      - name: Validate signing secrets (release-ipa)
        if: env.BUILD_TARGET == 'release-ipa'
        env:
          IOS_CERT: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
        run: |
          if [ -z "$IOS_CERT" ]; then
            echo "::error::Para release-ipa configure IOS_DISTRIBUTION_CERTIFICATE_BASE64, IOS_DISTRIBUTION_CERTIFICATE_PASSWORD e IOS_PROVISIONING_PROFILE_BASE64."
            exit 1
          fi

      - name: Import code signing (release-ipa)
        if: env.BUILD_TARGET == 'release-ipa'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile (release-ipa)
        if: env.BUILD_TARGET == 'release-ipa'
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PP_PATH="$RUNNER_TEMP/controle-de-bola.mobileprovision"
          echo "$PROFILE_B64" | base64 --decode > "$PP_PATH"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"${UUID}.mobileprovision"
          echo "PROVISIONING_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "DEVELOPMENT_TEAM=$TEAM_ID" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Perfil instalado: $PROFILE_NAME ($UUID) team=$TEAM_ID"

      - name: Build iOS (Simulator)
        if: env.BUILD_TARGET == 'simulator'
        run: |
          set -euo pipefail
          xcodebuild \
            "${XCODE_PROJECT_FLAG}" "${XCODE_PROJECT_PATH}" \
            -scheme App \
            -resolvePackageDependencies
          xcodebuild \
            "${XCODE_PROJECT_FLAG}" "${XCODE_PROJECT_PATH}" \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS (Release IPA)
        if: env.BUILD_TARGET == 'release-ipa'
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/App.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/ipa"
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"

          # Nao usar heredoc com linhas na coluna 0 - quebra o YAML do workflow (0 jobs).
          python3 - <<'PY'
          import os
          from pathlib import Path
          plist = Path(os.environ["RUNNER_TEMP"]) / "ExportOptions.plist"
          team = os.environ["DEVELOPMENT_TEAM"]
          bundle = os.environ["BUNDLE_ID"]
          profile = os.environ["PROVISIONING_PROFILE_NAME"]
          plist.write_text(
              f"""<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>{team}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>{bundle}</key>
              <string>{profile}</string>
            </dict>
          </dict>
          </plist>
          """,
              encoding="utf-8",
          )
          print(f"ExportOptions escrito: {plist}")
          PY

          xcodebuild \
            "${XCODE_PROJECT_FLAG}" "${XCODE_PROJECT_PATH}" \
            -scheme App \
            -resolvePackageDependencies
          xcodebuild \
            "${XCODE_PROJECT_FLAG}" "${XCODE_PROJECT_PATH}" \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$PROVISIONING_PROFILE_UUID" \
            archive

          mkdir -p "$EXPORT_PATH"
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -exportPath "$EXPORT_PATH"

          mkdir -p ios/build/ipa
          cp -R "$EXPORT_PATH"/*.ipa ios/build/ipa/

      - name: Upload Simulator app artifact
        if: env.BUILD_TARGET == 'simulator'
        uses: actions/upload-artifact@v6
        with:
          name: ios-simulator-build
          path: |
            ios/DerivedData/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: warn
          retention-days: 14

      - name: Upload IPA artifact
        if: env.BUILD_TARGET == 'release-ipa'
        uses: actions/upload-artifact@v6
        with:
          name: ios-release-ipa
          path: |
            ios/build/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 30
