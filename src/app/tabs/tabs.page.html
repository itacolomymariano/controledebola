<ion-header>
  <app-user-bar></app-user-bar>
</ion-header>

<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button
      [selected]="isFooterTabActive('peladas')"
      (click)="openPeladasList()"
    >
      <ion-icon name="football"></ion-icon>
      <ion-label>{{ 'tabs.peladas' | t }}</ion-label>
    </ion-tab-button>
    <ion-tab-button [selected]="isFooterTabActive('search')" (click)="openSearchTab()">
      <ion-icon name="search"></ion-icon>
      <ion-label>{{ 'tabs.search' | t }}</ion-label>
    </ion-tab-button>
    <ion-tab-button [selected]="isFooterTabActive('events')" (click)="openEventsTab()">
      <ion-icon name="swap-horizontal"></ion-icon>
      <ion-label>{{ 'tabs.confrontos' | t }}</ion-label>
    </ion-tab-button>
    <ion-tab-button [selected]="isFooterTabActive('mural')" (click)="openMuralTab()">
      <ion-icon name="trophy"></ion-icon>
      <ion-label>{{ 'tabs.mural' | t }}</ion-label>
    </ion-tab-button>
    <ion-tab-button [selected]="isFooterTabActive('profile')" (click)="openProfileTab()">
      <ion-icon name="person"></ion-icon>
      <ion-label>{{ 'tabs.profile' | t }}</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
