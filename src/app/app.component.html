<ion-app>
  <ion-menu contentId="main-content" menuId="app-menu" type="overlay" (ionWillOpen)="onMenuWillOpen()">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>{{ 'menu.title' | t }}</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list lines="full" class="app-menu-list">
        <ion-item button detail="false" (click)="navigateFromMenu('/tabs/peladas')">
          <ion-icon name="football-outline" slot="start"></ion-icon>
          <ion-label>{{ 'tabs.peladas' | t }}</ion-label>
        </ion-item>
        <ion-item button detail="false" (click)="navigateFromMenu('/tabs/search')">
          <ion-icon name="search-outline" slot="start"></ion-icon>
          <ion-label>{{ 'tabs.search' | t }}</ion-label>
        </ion-item>
        <ion-item button detail="false" (click)="navigateFromMenu('/tabs/mural')">
          <ion-icon name="trophy-outline" slot="start"></ion-icon>
          <ion-label>{{ 'tabs.mural' | t }}</ion-label>
        </ion-item>
        <ion-item button detail="false" (click)="navigateFromMenu('/tabs/profile')">
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-label>{{ 'tabs.profile' | t }}</ion-label>
        </ion-item>
        <ion-item button detail="false" (click)="navigateFromMenu('/inbox')">
          <ion-icon name="mail-outline" slot="start"></ion-icon>
          <ion-label>{{ 'menu.inbox' | t }}</ion-label>
        </ion-item>
        <ion-item button detail="false" [disabled]="inviteShareBusy" (click)="inviteFriendsFromMenu()">
          <ion-icon name="share-social-outline" slot="start"></ion-icon>
          <ion-label>{{ 'menu.invite' | t }}</ion-label>
        </ion-item>
        <ion-item button detail="false" (click)="navigateFromMenu('/tabs/peladas')">
          <ion-icon name="help-circle-outline" slot="start"></ion-icon>
          <ion-label>{{ 'menu.help' | t }}</ion-label>
        </ion-item>
        <ion-item button detail="false" (click)="openGuideFromMenu()">
          <ion-icon name="book-outline" slot="start"></ion-icon>
          <ion-label>{{ 'menu.guide' | t }}</ion-label>
        </ion-item>
        <ion-item button detail="false" (click)="navigateFromMenu('/about')">
          <ion-icon name="information-circle-outline" slot="start"></ion-icon>
          <ion-label>{{ 'menu.about' | t }}</ion-label>
        </ion-item>
        <ion-item class="app-menu-push-item" lines="none">
          <ion-icon name="notifications-outline" slot="start"></ion-icon>
          <ion-label>{{ 'menu.notifications' | t }}</ion-label>
          <ion-toggle
            slot="end"
            [checked]="pushNotificationsEnabled"
            [disabled]="pushToggleBusy"
            (ionChange)="onPushNotificationsToggle($event)"
          ></ion-toggle>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
