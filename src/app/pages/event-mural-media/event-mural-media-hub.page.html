<ion-header>
  <app-user-bar></app-user-bar>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="'/event/' + eventId + '/mural'"></ion-back-button>
    </ion-buttons>
    <ion-title>Imprensa / Midia</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-note color="medium">Escolha o formato para acompanhar a cobertura do evento.</ion-note>

  <ion-grid class="media-hub-grid">
    <ion-row>
      <ion-col size="6">
        <button type="button" class="media-action-tile" (click)="openRadio()">
          <ion-icon name="radio-outline" aria-hidden="true"></ion-icon>
          <span>Radio</span>
        </button>
      </ion-col>
      <ion-col size="6">
        <button type="button" class="media-action-tile" (click)="openJournal()">
          <ion-icon name="newspaper-outline" aria-hidden="true"></ion-icon>
          <span>Jornal</span>
        </button>
      </ion-col>
      <ion-col size="6">
        <button type="button" class="media-action-tile" (click)="openVideo()">
          <ion-icon name="videocam-outline" aria-hidden="true"></ion-icon>
          <span>Video</span>
        </button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
