<ion-content class="home-hub-content">
  <div class="home-hub-shell">
    <app-home-hub-hero></app-home-hub-hero>
    <div class="home-door-grid" role="navigation" [attr.aria-label]="'homeHub.doorsAria' | t">
      @for (door of doors; track door.id) {
        <app-home-door-card
          [titleKey]="door.titleKey"
          [hintKey]="door.hintKey"
          [icon]="door.icon"
          [variant]="door.variant"
          (activate)="activateCard(door)"
        ></app-home-door-card>
      }
    </div>
    <div class="home-hub-footer-wave" aria-hidden="true"></div>
  </div>
</ion-content>
