<ion-toolbar class="user-bar">
  <ion-buttons slot="start" class="user-bar-start">
    <button
      type="button"
      class="user-bar-logo-btn"
      (click)="openLogo()"
      [class.user-bar-logo-btn--zoom]="enableImageZoom"
      [attr.aria-label]="'homeHub.zoomLogo' | t"
    >
      <img [src]="appLogoSrc" alt="Controle de Bola" class="user-bar-logo" />
    </button>
    <button
      type="button"
      class="user-bar-avatar-btn"
      (click)="openAvatarZoom()"
      [class.user-bar-avatar-btn--zoom]="enableImageZoom && avatarUrl"
      [attr.aria-label]="'homeHub.zoomAvatar' | t"
    >
      <app-user-avatar
        [avatarUrl]="avatarUrl"
        alt="Foto de perfil"
        size="sm"
      ></app-user-avatar>
    </button>
  </ion-buttons>
  <ion-title class="apelido-title">{{ apelido }}</ion-title>
  <ion-buttons slot="end">
    <app-help-balloon [textKey]="helpKey"></app-help-balloon>
    <ion-button class="inbox-button" (click)="openInbox()" [attr.aria-label]="'Caixa de entrada'">
      <ion-icon name="mail-outline" slot="icon-only"></ion-icon>
      @if (unreadAppMessages > 0) {
        <ion-badge color="danger" class="inbox-badge inbox-badge--messages">{{ unreadAppMessages }}</ion-badge>
      }
      @if (inboxAttentionCount > 0) {
        <ion-badge color="warning" class="inbox-badge inbox-badge--attention" [attr.title]="'Convites e pendencias'">
          {{ inboxAttentionCount }}
        </ion-badge>
      }
    </ion-button>
    <ion-button (click)="openMenu()" aria-label="Abrir menu">
      <ion-icon name="menu-outline" slot="icon-only"></ion-icon>
    </ion-button>
  </ion-buttons>
</ion-toolbar>
