<ion-header>
  <ion-toolbar>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()" [attr.aria-label]="'imageLightbox.close' | t">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ imageAlt }}</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="image-lightbox-content" (click)="dismiss()">
  <div class="image-lightbox-frame" (click)="$event.stopPropagation()">
    <img [src]="imageSrc" [alt]="imageAlt" class="image-lightbox-img" />
  </div>
</ion-content>
