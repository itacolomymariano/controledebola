<ng-container [formGroup]="form">
  @for (field of fields; track field.key) {
    @if (showField(field)) {
      @if (field.type === 'boolean') {
        <ion-item lines="full">
          <ion-toggle justify="space-between" [formControlName]="field.key">
            {{ field.label }}
          </ion-toggle>
        </ion-item>
      } @else if (field.type === 'money') {
        <ion-item>
          <ion-input
            type="number"
            [label]="field.label"
            labelPlacement="stacked"
            [formControlName]="field.key"
            min="0"
            step="0.01"
            inputmode="decimal"
            placeholder="R$"
          ></ion-input>
        </ion-item>
      } @else if (field.type === 'textarea') {
        <ion-item>
          <ion-textarea
            [label]="field.label"
            labelPlacement="stacked"
            [formControlName]="field.key"
            autoGrow="true"
            rows="4"
          ></ion-textarea>
        </ion-item>
      } @else if (field.type === 'pix') {
        <ion-item>
          <ion-input
            [label]="field.label"
            labelPlacement="stacked"
            [formControlName]="field.key"
          ></ion-input>
          <app-pix-copy-button
            slot="end"
            [text]="pixFieldValue(field.key)"
          ></app-pix-copy-button>
        </ion-item>
      } @else {
        <ion-item>
          <ion-input
            [label]="field.label"
            labelPlacement="stacked"
            [formControlName]="field.key"
          ></ion-input>
        </ion-item>
      }
    }
  }
</ng-container>
