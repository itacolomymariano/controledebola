@if (text; as body) {
  <ion-button
    fill="clear"
    [id]="triggerId"
    (click)="$event.stopPropagation()"
    aria-label="Ajuda desta tela"
  >
    <ion-icon slot="icon-only" name="help-circle-outline"></ion-icon>
  </ion-button>
  <ion-popover #balloonPopover [trigger]="triggerId" side="bottom" alignment="end" (didDismiss)="onDismiss()">
    <ng-template>
      <ion-content class="ion-padding help-balloon-popover">
        <div class="balloon-header">
          <h3>{{ titleKey | t }}</h3>
          <ion-button fill="clear" size="small" color="medium" class="balloon-close" (click)="balloonPopover.dismiss()" aria-label="Fechar">
            <ion-icon slot="icon-only" name="close-outline"></ion-icon>
          </ion-button>
        </div>
        <p class="help-balloon-text">{{ body }}</p>
        <div class="balloon-actions">
          <ion-button size="small" fill="outline" color="medium" (click)="toggleSpeech()">
            @if (speaking) {
              <ion-icon slot="start" name="stop-circle-outline"></ion-icon>
              {{ 'mural.rule.stop' | t }}
            } @else {
              <ion-icon slot="start" name="volume-high-outline"></ion-icon>
              {{ 'mural.rule.listen' | t }}
            }
          </ion-button>
          <ion-button size="small" fill="solid" color="medium" (click)="balloonPopover.dismiss()">
            <ion-icon slot="start" name="close-outline"></ion-icon>
            Fechar
          </ion-button>
        </div>
      </ion-content>
    </ng-template>
  </ion-popover>
}
