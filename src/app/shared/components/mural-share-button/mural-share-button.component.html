<span #btnHost class="mural-share-exclude">
  <ion-button
    fill="clear"
    size="small"
    class="mural-share-btn"
    [disabled]="disabled || sharing || !context"
    (click)="share(); $event.stopPropagation()"
    aria-label="Compartilhar card"
  >
    @if (sharing) {
      <ion-spinner name="crescent"></ion-spinner>
    } @else {
      <ion-icon slot="icon-only" name="share-social-outline"></ion-icon>
    }
  </ion-button>
</span>
